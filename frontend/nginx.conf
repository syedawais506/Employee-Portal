server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html is the one file that must never be cached — it's what
        # points the browser at that build's content-hashed JS/CSS files.
        # Without this, browsers apply their own heuristic freshness to the
        # plain Last-Modified/ETag nginx sends by default, so a deploy can
        # look "not applied" simply because the tab is still holding an old
        # cached index.html referencing yesterday's hashed filenames.
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
