name: employee-portal

services:
  postgres:
    build:
      context: .
      dockerfile: postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      # No insecure fallback here on purpose — a well-known default password
      # is one env file away from being the real credential on a public host.
      # Set a real value in docker/.env (see docker/.env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:-employee_portal}
      # Read by docker/postgres-initdb/01-create-app-role.sh (below) — the
      # restricted, non-superuser role the app actually connects as, so RLS
      # policies aren't bypassed. Only used on first-ever init of an empty
      # postgres_data volume, same as POSTGRES_PASSWORD above.
      APP_DB_USER: ${APP_DB_USER:-app_runtime}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in docker/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-employee_portal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # quay.io, not docker.io/minio/minio — Docker Hub's minio/minio image was
    # deprecated/rate-limited; quay.io is MinIO's own current distribution.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Same "no insecure fallback" reasoning as POSTGRES_PASSWORD above.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in docker/.env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in docker/.env}
    ports:
      # Bound to loopback by default — nginx is the only service meant to be
      # reachable from outside this host (see the nginx service below); a
      # browser on the SAME machine still reaches MinIO fine via localhost
      # for presigned URLs (see S3_PUBLIC_ENDPOINT_URL). Override S3_HOST_BIND
      # to 0.0.0.0 only if you deliberately want MinIO reachable directly
      # from other machines (e.g. browsers hitting a remote server).
      - "${S3_HOST_BIND:-127.0.0.1}:9000:9000"
      - "${S3_HOST_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      # Dev-only email capture — never meant to be reachable from outside
      # this host (anyone who could see its inbox could read password-reset
      # links for any account).
      - "127.0.0.1:8025:8025"

  backend:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in docker/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Restricted, non-superuser role — see docker/postgres-initdb — so RLS
      # policies actually constrain what this process can read/write.
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-app_runtime}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in docker/.env}@postgres:5432/${POSTGRES_DB:-employee_portal}
      # Migrations need DDL/ownership privileges the restricted role above
      # deliberately doesn't have — only alembic (run via `docker exec
      # backend alembic upgrade head`) should ever use this. See
      # backend/alembic/env.py.
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@postgres:5432/${POSTGRES_DB:-employee_portal}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@employee-portal.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      # Must be reachable from the browser, unlike S3_ENDPOINT_URL above
      # (the internal Docker hostname) — see storage.py for why. Override if
      # MinIO is reachable at a different host/port from your machine.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in docker/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in docker/.env}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-employee-portal}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      # Ask HR chatbot (Phase 13) — free tier key from aistudio.google.com/apikey.
      # Leave unset to keep the feature dark even for companies that enable it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    # Explicit concurrency — left unset, celery defaults to os.cpu_count(),
    # which on a bigger production host could multiply DB_POOL_SIZE far
    # beyond what Postgres' max_connections allows (see app/core/config.py).
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in docker/.env}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-app_runtime}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in docker/.env}@postgres:5432/${POSTGRES_DB:-employee_portal}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@employee-portal.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
    # Overrides the backend image's baked-in HEALTHCHECK (curl localhost:8000/
    # health), which this service inherits despite running no HTTP server —
    # it would report "unhealthy" forever otherwise.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/app/celerybeat-data/celerybeat-schedule
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in docker/.env}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-app_runtime}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in docker/.env}@postgres:5432/${POSTGRES_DB:-employee_portal}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@employee-portal.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
    volumes:
      - celery_beat_data:/app/celerybeat-data
    # Overrides the backend image's baked-in HEALTHCHECK (curl localhost:8000/
    # health), which this service inherits despite running no HTTP server —
    # it would report "unhealthy" forever otherwise. `celery beat` has no
    # built-in ping (that's a worker-only command), so fall back to checking
    # the schedule file it touches every tick was written recently.
    healthcheck:
      test: ["CMD-SHELL", "find /app/celerybeat-data/celerybeat-schedule -newermt '-90 seconds' | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    # VITE_API_BASE_URL is compiled into the static bundle at build time (Vite
    # convention), not read at container runtime — it already defaults to the
    # relative "/api/v1" that this gateway topology needs, so no build arg is
    # passed here. Override via --build-arg if you ever serve the API from a
    # different origin than the one Nginx is fronting.
    build:
      context: ../frontend
      target: production
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
  celery_beat_data:
